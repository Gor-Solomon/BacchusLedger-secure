<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify seal · Bacchus Ledger</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { background: var(--bg); }
    .vf { max-width: 760px; margin: 0 auto; padding: var(--s-24) var(--s-16) var(--s-48); }
    .vf-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s-24); box-shadow: var(--shadow); }
    .verdict { font-size: var(--fs-28); font-weight: 700; padding: var(--s-16) var(--s-24); border-radius: var(--r-ctl); margin: var(--s-16) 0; }
    .verdict.ok { background: var(--green-soft); color: var(--green); }
    .verdict.bad { background: var(--red-soft); color: var(--red); }
    .verdict small { display: block; font-size: var(--fs-14); font-weight: 500; margin-top: 4px; }
    code.hash { display: block; font-size: 12px; word-break: break-all; background: #F3F1EE; border-radius: 6px; padding: 6px 8px; margin: 2px 0 12px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--s-16); margin: 0 0 var(--s-16); } dt { color: var(--muted); } dd { margin: 0; min-width: 0; }
    .demo { margin-top: var(--s-24); padding-top: var(--s-16); border-top: 1px dashed var(--line); }
  </style>
</head>
<body>
  <div class="vf"><div class="vf-card" id="vf"><p class="muted">Recomputing the hash chain…</p></div></div>
  <script>
    "use strict";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const q = new URLSearchParams(location.search), batch = q.get("batch") || "";
    let showDemo = q.get("demo") === "1";
    async function load() {
      const el = document.getElementById("vf");
      try {
        const r = await fetch(`/api/verify?batch=${encodeURIComponent(batch)}`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.statusText);
        const v = d.result;
        const verdict = v.ok
          ? `<div class="verdict ok" id="verdict">✅ Verified, unchanged<small>${v.entries} entries recomputed · signature valid${v.unsealed ? ` · ${v.unsealed} newer entries not sealed yet (open the report to seal them)` : ""}</small></div>`
          : v.status === "tampered"
            ? `<div class="verdict bad" id="verdict">❌ Tampered at entry ${esc(v.tampered_at)}<small>${esc(v.tampered_what)}</small></div>`
            : `<div class="verdict bad" id="verdict">❌ ${esc(v.status)}</div>`;
        el.innerHTML = `<h1>Verify seal</h1><div><b>${esc(batch)}</b> · Bacchus Ledger</div>${verdict}
          <dl><dt>Sealed</dt><dd>${esc(v.sealed_at || "—")}</dd><dt>Algorithm</dt><dd>SHA-256 hash chain · ECDSA P-256</dd>
          <dt>Key</dt><dd>${esc(v.key_id)} · <b>${esc(d.key_note)}</b></dd><dt>Signature</dt><dd>${v.signature_ok ? "valid" : "<b class='err'>invalid</b>"}</dd></dl>
          <div class="small muted">Final hash (sealed)</div><code class="hash">${esc(v.final_hash)}</code>
          <div class="small muted">Signature</div><code class="hash">${esc(v.signature)}</code>
          <p class="small muted">The page recomputes every entry hash from the database rows as they are now and compares it with the sealed chain.</p>
          <a class="btn ghost small" href="report.html?batch=${encodeURIComponent(batch)}">Ledger report</a>
          ${showDemo ? `<div class="demo"><button class="btn small danger" id="tamper">Tamper one entry (demo)</button> <button class="btn small" id="resetDemo">Reset demo</button>
            <span class="small muted">Secure demo copy only: changes one lab temperature in this copy's database.</span><div id="tamperOut" class="small"></div></div>` : ""}`;
        const rs = document.getElementById("resetDemo");
        if (rs) rs.onclick = async () => {
          const r3 = await fetch(`/api/demo/reset-seal?batch=${encodeURIComponent(batch)}`, { method: "POST" });
          const x = await r3.json();
          await load();
          document.getElementById("tamperOut").textContent = r3.ok ? `Reset: ${x.restored} changed value(s) restored${x.resealed ? ", batch sealed again from its current rows" : ""}.` : x.error;
        };
        const t = document.getElementById("tamper");
        if (t) t.onclick = async () => {
          const r2 = await fetch(`/api/demo/tamper?batch=${encodeURIComponent(batch)}`, { method: "POST" });
          const x = await r2.json();
          await load();
          document.getElementById("tamperOut").textContent = r2.ok ? `Changed entry ${x.entry} (${x.table} #${x.row_id}, ${x.date}): ${x.field} ${x.before} → ${x.after}` : x.error;
        };
      } catch (e) { el.innerHTML = `<p class="err">Could not verify: ${esc(e.message)}</p>`; }
    }
    // hidden: ?demo=1 or Shift+T shows the tamper button
    document.addEventListener("keydown", (e) => { if (e.shiftKey && e.key === "T" && !showDemo) { showDemo = true; load(); } });
    load();
  </script>
</body>
</html>
